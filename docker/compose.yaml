name: spotify-lakehouse

networks:
  spotify-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:16.9-alpine
    container_name: spotify-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - spotify-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spotify-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - spotify-network

    restart: unless-stopped

  # --------------------------------------------------
  # MinIO
  # --------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: spotify-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - spotify-network

    restart: unless-stopped

  # --------------------------------------------------
  # Airflow Initialization
  # --------------------------------------------------
  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: spotify-airflow-init

    env_file:
      - ../.env

    user: "${AIRFLOW_UID}:0"
    working_dir: /opt/airflow

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - spotify-network

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - ../src:/opt/airflow/src

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "

  # --------------------------------------------------
  # Airflow Webserver
  # --------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: spotify-airflow-webserver

    env_file:
      - ../.env

    user: "${AIRFLOW_UID}:0"
    working_dir: /opt/airflow

    depends_on:
      - airflow-init

    ports:
      - "8080:8080"

    command: webserver

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - ../src:/opt/airflow/src

    networks:
      - spotify-network

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

  # --------------------------------------------------
  # Airflow Scheduler
  # --------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: spotify-airflow-scheduler

    env_file:
      - ../.env

    user: "${AIRFLOW_UID}:0"
    working_dir: /opt/airflow

    depends_on:
      - airflow-init

    command: scheduler

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - ../src:/opt/airflow/src

    networks:
      - spotify-network

    restart: unless-stopped