[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-analytics-lakehouse"
version = "0.1.0"
description = "End-to-end Spotify Analytics Lakehouse using open-source technologies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gaurav Sudan" }
]
dependencies = [
    "boto3>=1.43.56",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
